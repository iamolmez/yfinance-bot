# Render Blueprint - https://render.com
# Kullanim: render.com -> New -> Blueprint -> bu repo'nun public GitHub linki
#
# NOT 1: Render ucretsiz katman 15 dk sessizlikte servisi uyutur. UptimeRobot
# (ucretsiz) ile 5 dk'da bir / pingleyerek uyanik tutulur.
# NOT 2: Render ucretsiz katmanda kalici disk DESTEKLEMEZ. Veriler Neon
# (ucretsiz Postgres) kullanilarak korunur -> DATABASE_URL gerekli.
services:
  - type: web
    name: yfinance-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false        # Dashboard'dan guvenli sekilde set edilecek
      - key: ALLOWED_USER_IDS
        sync: false
      - key: DATABASE_URL
        sync: false        # Neon ucretsiz Postgres baglanti adresi
      - key: TZ
        value: Europe/Istanbul
